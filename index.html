<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arif's Premium Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        /* --- Auth Container --- */
        .auth-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.5s ease;
        }

        h2 { font-size: 26px; margin-bottom: 20px; color: #60a5fa; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: white;
            color: black;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .toggle-link span {
            color: #60a5fa;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- Dashboard Section --- */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            animation: slideUp 0.8s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 25px;
        }
    </style>
</head>
<body>

    <!-- Auth Box with Switch Option -->
    <div class="auth-container" id="auth-box">
        <div id="login-form">
            <h2>Member Portal</h2>
            <p style="margin-bottom: 20px; color: rgba(255,255,255,0.5);">Welcome back!</p>
            <input type="text" placeholder="Username" id="login-user">
            <input type="password" placeholder="Password">
            <button class="btn" onclick="handleLogin()">Login</button>
            <p class="toggle-link">New here? <span onclick="toggleAuth('signup')">Create Account</span></p>
        </div>

        <div id="signup-form" style="display: none;">
            <h2>Register</h2>
            <p style="margin-bottom: 20px; color: rgba(255,255,255,0.5);">Join our community</p>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="password" placeholder="Password">
            <button class="btn" onclick="handleLogin()">Sign Up</button>
            <p class="toggle-link">Already have an account? <span onclick="toggleAuth('login')">Login</span></p>
        </div>
    </div>

    <!-- Dashboard (Initialy Hidden) -->
    <div id="dashboard">
        <div class="nav-bar">
            <h3>Hello, Developer</h3>
            <button class="btn" style="width: auto; padding: 10px 20px;" onclick="location.reload()">Logout</button>
        </div>
        <div class="stats-grid">
            <div class="stat-card"><h3>Visitors</h3><p style="font-size: 24px; color: #60a5fa;">2,500</p></div>
            <div class="stat-card"><h3>Active Site</h3><p style="font-size: 24px; color: #60a5fa;">Online</p></div>
        </div>
        <div style="margin-top: 30px; background: rgba(255,255,255,0.03); padding: 30px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1);">
            <h2>Recent Activity</h2>
            <p style="color: rgba(255,255,255,0.6); margin-top: 10px;">• Dashboard has been updated to include registration.</p>
        </div>
    </div>

    <script>
        function toggleAuth(type) {
            const login = document.getElementById('login-form');
            const signup = document.getElementById('signup-form');
            if(type === 'signup') {
                login.style.display = 'none';
                signup.style.display = 'block';
            } else {
                signup.style.display = 'none';
                login.style.display = 'block';
            }
        }

        function handleLogin() {
            document.getElementById('auth-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.body.style.alignItems = 'flex-start';
            document.body.style.paddingTop = '50px';
        }
    </script>
</body>
</html>
