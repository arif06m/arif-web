<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Greeting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 60px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            animation: premiumFade 1.2s ease-out;
        }

        @keyframes premiumFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .premium-icon {
            font-size: 60px;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.5));
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .action-area {
            position: relative;
            display: inline-block;
        }

        .main-btn {
            background: #ffffff;
            color: #0f172a;
            padding: 16px 45px;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .main-btn:hover {
            transform: translateY(-5px);
            background: #f8fafc;
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.15);
        }

        .status-badge {
            margin-top: 40px;
            font-size: 13px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            height: 6px;
            width: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="premium-icon">🤝</div>
        <h1>Hello & Welcome</h1>
        <p>
            It is a profound honor to have you here. Your presence means a lot. 
            Thank you for taking a moment to step into my world. 
            I am thrilled to share my journey and upcoming projects with you.
        </p>
        
        <div class="action-area">
            <a href="#" class="main-btn" onclick="alert('Thank you for your interest! More updates are on the way.')">Discover More</a>
        </div>

        <!-- প্রফেশনাল স্ট্যাটাস ব্যাজ (কপিরাইটের বদলে) -->
        <div class="status-badge">
            <span class="dot"></span>
            Verified Connection
        </div>
    </div>

</body>
</html>
