<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* Glass Card Design */
        .auth-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .toggle-link {
            margin-top: 25px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .toggle-link span {
            color: #60a5fa;
            cursor: pointer;
            font-weight: bold;
        }

        #signup-form { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Form -->
        <div id="login-form">
            <h2>Welcome Back!</h2>
            <p>Login to your account</p>
            <div class="input-group">
                <input type="text" placeholder="Username or Email">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password">
            </div>
            <button class="btn" onclick="handleAccess()">Login</button>
            <div class="toggle-link">
                Don't have an account? <span onclick="toggleForms('signup')">Sign Up</span>
            </div>
        </div>

        <!-- Sign Up Form -->
        <div id="signup-form">
            <h2>Create Account</h2>
            <p>Enter your details to register</p>
            <div class="input-group">
                <input type="text" placeholder="Full Name">
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email Address">
            </div>
            <div class="input-group">
                <input type="password" placeholder="New Password">
            </div>
            <button class="btn" onclick="handleAccess()">Sign Up</button>
            <div class="toggle-link">
                Already have an account? <span onclick="toggleForms('login')">Login</span>
            </div>
        </div>
    </div>

    <script>
        function toggleForms(type) {
            const login = document.getElementById('login-form');
            const signup = document.getElementById('signup-form');
            
            if(type === 'signup') {
                login.style.display = 'none';
                signup.style.display = 'block';
            } else {
                signup.style.display = 'none';
                login.style.display = 'block';
            }
        }

        function handleAccess() {
            alert("Success! Moving to the next step soon.");
        }
    </script>
</body>
</html>
